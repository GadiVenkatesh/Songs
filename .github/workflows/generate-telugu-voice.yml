name: Generate Telugu Voice MP3

on:
  workflow_dispatch:
    inputs:
      place:
        description: "Village name"
        required: true
        type: string
      area:
        description: "Mandal name"
        required: true
        type: string
      person_1:
        description: "MPTC candidate name"
        required: true
        type: string
      person_2:
        description: "ZPTC candidate name"
        required: true
        type: string
      voice:
        description: "Telugu voice"
        required: true
        type: choice
        options:
          - te-IN-ShrutiNeural
          - te-IN-MohanNeural
        default: te-IN-ShrutiNeural
      rate:
        description: "Speech speed"
        required: true
        type: choice
        options:
          - "-5%"
          - "+0%"
          - "+5%"
        default: "+0%"
      pitch:
        description: "Voice pitch"
        required: true
        type: choice
        options:
          - "-2Hz"
          - "+0Hz"
          - "+2Hz"
        default: "+0Hz"

permissions:
  contents: read

jobs:
  generate-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TTS dependency
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-tts.txt

      - name: Prepare announcement config
        env:
          PLACE: ${{ inputs.place }}
          AREA: ${{ inputs.area }}
          MPTC_CANDIDATE: ${{ inputs.person_1 }}
          ZPTC_CANDIDATE: ${{ inputs.person_2 }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("config/announcement.json")
          config = json.loads(path.read_text(encoding="utf-8"))
          config["place"] = os.environ["PLACE"].strip()
          config["area"] = os.environ["AREA"].strip()
          config["person_1"] = os.environ["MPTC_CANDIDATE"].strip()
          config["person_2"] = os.environ["ZPTC_CANDIDATE"].strip()
          config["announcement"] = ""
          required = ("place", "area", "person_1", "person_2")
          if any(not config[key] for key in required):
              raise SystemExit("Village, mandal, MPTC candidate, and ZPTC candidate are required.")
          path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          PY

      - name: Generate Telugu MP3 and transcript
        env:
          VOICE: ${{ inputs.voice }}
          RATE: ${{ inputs.rate }}
          PITCH: ${{ inputs.pitch }}
        run: |
          python src/generate_telugu_voice.py --non-interactive --voice "$VOICE" --rate "$RATE" --pitch "$PITCH" --output output/telugu-announcement.mp3
          test -s output/telugu-announcement.mp3
          test -s output/telugu-announcement.txt

      - name: Upload downloadable audio artifact
        uses: actions/upload-artifact@v4
        with:
          name: telugu-voice-mp3
          path: |
            output/telugu-announcement.mp3
            output/telugu-announcement.txt
          if-no-files-found: error
          retention-days: 7
